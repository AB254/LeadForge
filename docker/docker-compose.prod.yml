version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: leadforge-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: leadforge
      POSTGRES_PASSWORD: leadforge
      POSTGRES_DB: leadforge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadforge -d leadforge"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: leadforge-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: leadforge-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      DATABASE_URL: "postgresql://leadforge:leadforge@postgres:5432/leadforge?schema=public"
      REDIS_URL: "redis://redis:6379"
      NODE_ENV: production
      PORT: "4000"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: leadforge-web
    restart: unless-stopped
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://134.209.123.46/api"
      NEXT_PUBLIC_MAPBOX_TOKEN: "${NEXT_PUBLIC_MAPBOX_TOKEN}"
      NODE_ENV: production
    depends_on:
      - api

  scraper-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: leadforge-scraper
    restart: unless-stopped
    command: node workers/scraper/dist/index.js
    environment:
      DATABASE_URL: "postgresql://leadforge:leadforge@postgres:5432/leadforge?schema=public"
      REDIS_URL: "redis://redis:6379"
      NODE_ENV: production
      MAX_CONCURRENT_BROWSERS: "1"
      SCRAPE_DELAY_MS: "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  analyzer-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: leadforge-analyzer
    restart: unless-stopped
    command: node workers/analyzer/dist/analyzer/src/index.js
    environment:
      DATABASE_URL: "postgresql://leadforge:leadforge@postgres:5432/leadforge?schema=public"
      REDIS_URL: "redis://redis:6379"
      NODE_ENV: production
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: leadforge-nginx
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
